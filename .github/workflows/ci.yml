name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy polyglot_ast_slicer
      - name: Test
        run: uv run pytest
      - name: Metrics drift check (offline)
        run: uv run python scripts/generate_metrics.py --check
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel in a clean venv and smoke test
        shell: bash
        run: |
          uv venv .smoke-venv
          PYTHON=.smoke-venv/bin/python
          if [ -f .smoke-venv/Scripts/python.exe ]; then PYTHON=.smoke-venv/Scripts/python.exe; fi
          uv pip install --python "$PYTHON" dist/*.whl
          "$PYTHON" -m polyglot_ast_slicer --version
          "$PYTHON" verify/ci_smoke.py
