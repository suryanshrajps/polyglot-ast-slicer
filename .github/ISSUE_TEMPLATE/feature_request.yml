name: Feature request
description: Propose a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today? Include a concrete repository example.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool return, and how would we measure success?
    validations: { required: true }
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [resolution, slice payload, MCP UX, packaging, language support]
    validations: { required: true }
