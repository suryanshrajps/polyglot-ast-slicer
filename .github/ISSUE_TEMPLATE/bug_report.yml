name: Bug report
description: Wrong edge, missed edge, crash, or bad slice
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the raw output.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `polyglot-ast-slicer --version`
    validations: { required: true }
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Public URL and commit SHA, or a minimal reproduction.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual edge
      description: For graph bugs, include source line, target line and `explain_edge` output.
    validations: { required: true }
