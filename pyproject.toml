[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyglot-ast-slicer"
version = "0.4.0"
description = "Deterministic, token-efficient AST call-graph slicing for AI coding agents, exposed as a local MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ast", "tree-sitter", "mcp", "call-graph", "llm", "code-context", "token-efficiency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.1.1",
    "networkx>=3.3",
    "fastmcp>=2.1.0",
    "tiktoken>=0.8.0",
    "watchfiles>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "mypy>=1.11.0", "ruff>=0.6.0", "jedi>=0.19.0"]

[project.scripts]
polyglot-ast-slicer = "polyglot_ast_slicer.server:main"

[project.urls]
Homepage = "https://github.com/suryanshraj/polyglot-ast-slicer"
Issues = "https://github.com/suryanshraj/polyglot-ast-slicer/issues"

[tool.hatch.build.targets.wheel]
packages = ["polyglot_ast_slicer"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "benchmarks/edge_eval"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
